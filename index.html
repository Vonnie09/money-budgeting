<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Money Manager · Demo</title>
  <meta name="description" content="Track expenses in seconds. See where money goes, set budgets and organise bills. A demo web app with sample data.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#D9DDE1">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0E10">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..900&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
  <!-- order matters: later files build on earlier ones -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script>
    // Apply the saved theme before the page paints, so there is no flash.
    try { var t = localStorage.getItem('mm-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18V7l8 6 8-6v11"/></svg>
        </span>
        <span>Money Manager</span>
      </a>
      <nav class="nav" id="side-nav" aria-label="Main"></nav>
      <div class="mode-side">
        <div data-mode-slot></div>
        <p>Everything you add stays in this browser. Nothing is sent anywhere.</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-heading">
          <h1 id="page-title">Home</h1>
          <p id="page-sub"></p>
        </div>
        <div class="top-actions">
          <button class="btn btn-primary desktop-only" data-action="add">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add entry
          </button>
          <button class="icon-btn" data-action="calc" aria-label="Calculator" title="Calculator" id="btn-calc"></button>
          <button class="icon-btn" data-action="alerts" aria-label="Notifications" title="Notifications" id="btn-bell"></button>
          <button class="icon-btn" data-action="settings" aria-label="Settings" title="Settings" id="btn-settings"></button>
        </div>
      </header>

      <div class="mode-top" data-mode-slot></div>
      <section id="view" aria-live="polite"></section>
    </main>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Main"></nav>
    <button class="fab" data-action="add" aria-label="Add entry">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
